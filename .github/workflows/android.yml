name: Android

# Builds the Android APKs (per-ABI + universal).
#
#  - On its own: pull requests / branch pushes touching the Android port,
#    or manually (Actions -> Android -> Run workflow).
#  - From build.yml (workflow_call) on main and on v* tags, so the APKs
#    are part of every release and covered by SHA256SUMS.txt.
#
# Release signing (optional, recommended): add these repository secrets
#   ANDROID_KEYSTORE_BASE64   base64 of your .jks keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the APK is signed with the runner's throw-away debug key:
# installable, but every build has a different key, so it cannot be
# installed OVER a previous build (uninstall first).

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'android/**'
      - 'vpeen/**'
      - 'assets/**'
      - 'scripts/fetch-android-deps.sh'
      - 'scripts/test_android.py'
      - '.github/workflows/android.yml'
  push:
    branches-ignore: [ main ]      # main and tags go through build.yml
    paths:
      - 'android/**'
      - 'vpeen/**'
      - 'assets/**'
      - 'scripts/fetch-android-deps.sh'
      - 'scripts/test_android.py'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  apk:
    name: Build APK (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy compiles the app's Python with a build-machine interpreter
      # of the SAME minor version as the embedded one (app/build.gradle.kts).
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Android port verification (no device needed)
        run: python scripts/test_android.py

      - name: Read version
        id: ver
        run: echo "version=$(sed -n 's/^__version__ = \"\(.*\)\"$/\1/p' vpeen/__init__.py)" >> "$GITHUB_OUTPUT"

      - name: Fetch native sources (hev-socks5-tunnel, pinned)
        run: bash scripts/fetch-android-deps.sh

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "VPEEN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore configured."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - the APK is signed with a throw-away debug key."
          fi

      - name: Build release APKs
        working-directory: android
        env:
          VPEEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VPEEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VPEEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in android/app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" .apk | sed -e 's/^app-//' -e 's/-release$//' -e 's/-unsigned$//')
            cp "$f" "dist/VPeeN-${{ steps.ver.outputs.version }}-Android-${abi}.apk"
          done
          ls -la dist
          # tripwire: universal + 3 ABI splits
          [ "$(ls dist/*.apk | wc -l)" -ge 4 ]

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VPeeN-Android
          path: dist/VPeeN-*.apk
